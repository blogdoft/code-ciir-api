# host/path intentionally deviate from the code-rag-api.home.arpa (subdomain-per-service)
# convention used by other services in this cluster: this service is routed via a shared host
# (blogdoft.home.arpa) under the shared /code-brain path instead. /code-brain is stripped by the
# code-ciir-api-strip-code-brain Middleware (middleware.yaml) before forwarding, since the
# backend's controllers are rooted at "api/code-queries" (see CodeQueriesController/
# FeedbackController) with no "code-brain" segment. Format for router.middlewares:
# <namespace>-<middleware-name>@kubernetescrd (this Ingress is deployed into code-rag - see
# service.yaml's serverstransport annotation).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-ciir-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: code-rag-code-ciir-api-strip-code-brain@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: blogdoft.home.arpa
      http:
        paths:
          - path: /code-brain/api/code-queries
            pathType: Prefix
            backend:
              service:
                name: code-ciir-api
                port:
                  name: http
