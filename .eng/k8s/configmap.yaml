# Non-secret settings only - see src/CodeCiir.Api/appsettings.json for defaults.
# ConnectionStrings__Database is injected separately from the code-ciir-secrets Secret
# (see deployment.yaml) - read-only credentials, since this API never writes to code3rag
# except the additive code_query_feedback table (see .specs/06-code-query-feedback.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-ciir-config
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Development"
  # Swagger/OpenAPI is always mapped regardless of environment (Program.cs), so this is the only
  # thing telling the app it's reachable through the blogdoft.home.arpa/code-brain ingress prefix
  # (which the app otherwise has no way to see - Traefik strips it before forwarding, see
  # .eng/k8s/middleware.yaml) - used to build the OpenAPI document's "servers" entry so Swagger
  # UI's "Try it out" requests land on a real, resolvable URL. Left unset locally, where the
  # current request's own scheme/host stand in for it instead.
  PublicBaseUrl: "https://blogdoft.home.arpa/code-brain"
  # Traces flow through the cluster collector, which enriches them with Kubernetes metadata and
  # exports them to Tempo. The collector exposes OTLP/gRPC on port 4317.
  OTEL_SERVICE_NAME: "code-ciir-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  # Same shared Ollama instance code-rag-api already uses for embeddings. Model/Dimensions are
  # set here (not per-project): ciir_documents.embedding has one fixed vector width for the
  # whole code3rag installation, so every code-queries question is embedded with this single
  # app-wide model - see .specs/09-code-queries-filters.md.
  Embeddings__Provider: "Ollama"
  Embeddings__BaseUrl: "http://192.168.1.212:11434"
  Embeddings__TimeoutSeconds: "30"
  Embeddings__Model: "bge-m3"
  Embeddings__Dimensions: "1024"
  # Reranking of vector-search candidates, on by default in this cluster - same shared Ollama
  # instance/model code-rag-api already uses for reranking (qwen2.5:7b-instruct, an
  # instruct/chat model - NOT bge-m3, which is embeddings-only and can't be used here). See
  # .specs/10-reranking.md. This is why code-ciir-api-transport (serverstransport.yaml) exists:
  # Ollama reranking on CPU (no GPU) can take up to ~90s+ under load.
  Reranking__Provider: "Ollama"
  Reranking__Model: "qwen2.5:7b-instruct"
  Reranking__BaseUrl: "http://192.168.1.212:11434"
  Reranking__TimeoutSeconds: "120"
  Reranking__CandidatePoolSize: "25"
  Reranking__MaxConcurrency: "6"
  # Keycloak authentication (.specs/14-keycloak-auth.md) - off by default: the API stays open until
  # Keycloak__Enabled is "true". The other Keycloak__* values are IGNORED while it is off, so filling
  # them in does not protect anything by itself. Enabled=true makes REST endpoints require a Bearer
  # token (except /health and Swagger/OpenAPI) and requires Authority - startup fails without it.
  # "/mcp" ALWAYS stays anonymous, even with Enabled=true - MCP clients here have no way to attach a
  # token, so that endpoint is a deliberate, permanent exception (see Program.cs). Audience is
  # optional; leave it unset to accept any audience. No Secret is needed: validating a token only
  # takes the realm's public keys (JWKS).
  # Keycloak__Enabled: "true"
  # Keycloak__Authority: "https://keycloak.home.arpa/realms/blogdoft"
  # Keycloak__Audience: "code-ciir-api"
  # Optional: the Keycloak client this application is registered as - a public client (PKCE, no
  # secret) that Swagger UI's Authorize button also logs in with, so the API and Swagger share one
  # client id.
  # Keycloak__ClientId: "code-ciir-api"
